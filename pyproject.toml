[project]
name = "ghg-calculator"
version = "0.1.0"
description = "GHG Protocol Corporate Standard emissions calculator with CLI and MCP interfaces"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.14",
    "pint>=0.25",
    "pandas>=3.0",
    "plotly>=7.1",
    "typer>=0.27",
    "rich>=15.0",
    "fastmcp>=4.1",
    "jinja2>=3.1.6",
    "kaleido>=1.5",
]

[project.scripts]
ghg = "ghg_calculator.cli.app:app"
ghg-mcp = "ghg_calculator.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghg_calculator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "ruff>=0.17",
    "mypy>=2.4",
]
